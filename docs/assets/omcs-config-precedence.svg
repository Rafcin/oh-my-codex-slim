<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title>OMCS configuration precedence</title>
  <desc>Session policy overrides project policy, which overrides global preferences and built-in defaults.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#134E4A"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5EEAD4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".36"/></filter>
  </defs>
  <rect width="1440" height="560" rx="30" fill="url(#bg)"/>
  <text x="72" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700" fill="#F8FAFC">OMCS configuration precedence</text>
  <text x="72" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#CCFBF1">More local policy wins; only portable team policy belongs in the repository.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(94 238)"><rect width="250" height="144" rx="22" fill="#0F766E"/><text x="125" y="52" font-size="22" font-weight="700" fill="white">Session override</text><text x="125" y="84" font-size="14" fill="#CCFBF1">no file write</text><text x="125" y="108" font-size="14" fill="#CCFBF1">highest precedence</text></g>
    <g transform="translate(424 238)"><rect width="250" height="144" rx="22" fill="#0369A1"/><text x="125" y="52" font-size="22" font-weight="700" fill="white">Project policy</text><text x="125" y="84" font-size="14" fill="#E0F2FE">nearest omcs.config.json</text><text x="125" y="108" font-size="14" fill="#E0F2FE">checked in safely</text></g>
    <g transform="translate(754 238)"><rect width="250" height="144" rx="22" fill="#4F46E5"/><text x="125" y="52" font-size="22" font-weight="700" fill="white">Global preferences</text><text x="125" y="84" font-size="14" fill="#E0E7FF">private local policy</text><text x="125" y="108" font-size="14" fill="#E0E7FF">under CODEX_HOME</text></g>
    <g transform="translate(1084 238)"><rect width="250" height="144" rx="22" fill="#7C3AED"/><text x="125" y="52" font-size="22" font-weight="700" fill="white">Safe defaults</text><text x="125" y="84" font-size="14" fill="#EDE9FE">built into OMCS</text><text x="125" y="108" font-size="14" fill="#EDE9FE">always available</text></g>
  </g>
  <g fill="none" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"><path d="M344 310 H414"/><path d="M674 310 H744"/><path d="M1004 310 H1074"/></g>
  <text x="720" y="470" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#99F6E4">No credentials, provider settings, account choices, model pins, or arbitrary commands.</text>
</svg>
