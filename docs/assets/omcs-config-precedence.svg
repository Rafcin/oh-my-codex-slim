<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">OMCS configuration precedence</title>
  <desc id="desc">A monochrome precedence stack from a session override through project and global policy to safe defaults.</desc>
  <rect width="1440" height="500" fill="#FFFFFF"/>
  <text x="72" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#111111">Configuration stays predictable</text>
  <text x="72" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#525252">The nearest safe policy wins. Personal and provider state never enters project config.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(72 190)"><rect width="282" height="128" rx="10" fill="#111111" stroke="#111111" stroke-width="2"/><text x="141" y="48" font-size="20" font-weight="700" fill="#FFFFFF">Session</text><text x="141" y="78" font-size="14" fill="#E5E5E5">no file write</text><text x="141" y="102" font-size="14" fill="#E5E5E5">highest precedence</text></g>
    <g transform="translate(410 190)"><rect width="282" height="128" rx="10" fill="#F5F5F5" stroke="#111111" stroke-width="2"/><text x="141" y="48" font-size="20" font-weight="700" fill="#111111">Project</text><text x="141" y="78" font-size="14" fill="#525252">nearest omcs.config.json</text><text x="141" y="102" font-size="14" fill="#525252">portable team policy</text></g>
    <g transform="translate(748 190)"><rect width="282" height="128" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="141" y="48" font-size="20" font-weight="700" fill="#111111">Global</text><text x="141" y="78" font-size="14" fill="#525252">private preferences</text><text x="141" y="102" font-size="14" fill="#525252">under CODEX_HOME</text></g>
    <g transform="translate(1086 190)"><rect width="282" height="128" rx="10" fill="#FFFFFF" stroke="#A3A3A3" stroke-width="2"/><text x="141" y="48" font-size="20" font-weight="700" fill="#111111">Defaults</text><text x="141" y="78" font-size="14" fill="#525252">built into OMCS</text><text x="141" y="102" font-size="14" fill="#525252">always available</text></g>
  </g>
  <g fill="#111111"><path d="M392 254 l-12 -7 v14 z"/><path d="M730 254 l-12 -7 v14 z"/><path d="M1068 254 l-12 -7 v14 z"/></g><g stroke="#525252" stroke-width="2"><line x1="354" y1="254" x2="392" y2="254"/><line x1="692" y1="254" x2="730" y2="254"/><line x1="1030" y1="254" x2="1068" y2="254"/></g>
  <line x1="72" y1="390" x2="1368" y2="390" stroke="#E5E5E5" stroke-width="2"/>
  <text x="72" y="433" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">Excluded everywhere: credentials · provider settings · account choices · model pins · arbitrary commands</text>
</svg>
