<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Example OMCS route declaration in a macOS terminal</title>
  <desc id="desc">A synthetic Ghostty-style terminal shows a route declaration for a full OMCS workflow in a sample acme-widget project.</desc>
  <rect width="1440" height="900" fill="#F7F7F5"/>
  <rect x="56" y="48" width="1328" height="804" rx="24" fill="#171717" stroke="#303030" stroke-width="2"/>
  <path d="M80 48h1280a24 24 0 0 1 24 24v58H56V72a24 24 0 0 1 24-24Z" fill="#202020"/>
  <line x1="56" y1="130" x2="1384" y2="130" stroke="#303030" stroke-width="2"/>
  <circle cx="98" cy="89" r="12" fill="#FF605C"/><circle cx="130" cy="89" r="12" fill="#FFBD44"/><circle cx="162" cy="89" r="12" fill="#00CA4E"/>
  <text x="720" y="96" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, sans-serif" font-size="17" font-weight="500" fill="#A3A3A3">acme-widget — Codex CLI</text>
  <g font-family="&quot;SF Mono&quot;, &quot;SFMono-Regular&quot;, Menlo, Monaco, Consolas, monospace" font-size="24" dominant-baseline="middle">
    <text x="108" y="188" fill="#7DD3C7">example@acme-widget</text><text x="390" y="188" fill="#A3A3A3">~/work/acme-widget</text><text x="690" y="188" fill="#E5E5E5">$</text><text x="730" y="188" fill="#F5F5F5">Use OMCS to solve this issue</text>
    <text x="108" y="268" font-size="25" font-weight="700" fill="#B7A7FF">OMCS ROUTE</text>
    <g font-size="22">
      <text x="108" y="324" fill="#A3A3A3">profile</text><text x="304" y="324" fill="#525252">:</text><text x="346" y="324" fill="#E5E5E5">auto</text>
      <text x="108" y="370" fill="#A3A3A3">mode</text><text x="304" y="370" fill="#525252">:</text><text x="346" y="370" fill="#E5E5E5">full</text>
      <text x="108" y="416" fill="#A3A3A3">risk</text><text x="304" y="416" fill="#525252">:</text><text x="346" y="416" fill="#E5E5E5">wide blast radius; review required</text>
      <text x="108" y="462" fill="#A3A3A3">skills</text><text x="304" y="462" fill="#525252">:</text><text x="346" y="462" fill="#E5E5E5">context · codebase-design · plan · tdd · ai-slop-cleaner</text>
      <text x="346" y="496" fill="#E5E5E5">verification · code-review</text>
      <text x="108" y="542" fill="#A3A3A3">agents</text><text x="304" y="542" fill="#525252">:</text><text x="346" y="542" fill="#E5E5E5">architect → explorer + librarian → terra-fixer → reviewer</text>
      <text x="108" y="588" fill="#A3A3A3">council</text><text x="304" y="588" fill="#525252">:</text><text x="346" y="588" fill="#E5E5E5">disabled</text>
      <text x="108" y="634" fill="#A3A3A3">approval</text><text x="304" y="634" fill="#525252">:</text><text x="346" y="634" fill="#E5E5E5">material-decisions</text>
    </g>
    <line x1="108" y1="690" x2="1332" y2="690" stroke="#303030" stroke-width="2"/>
    <text x="108" y="748" font-size="20" fill="#A7F3D0">✓</text><text x="144" y="748" font-size="20" fill="#E5E5E5">understanding complete</text>
    <text x="470" y="748" font-size="20" fill="#FDE68A">•</text><text x="500" y="748" font-size="20" fill="#E5E5E5">design ready for approval</text>
    <text x="894" y="748" font-size="20" fill="#D4D4D4">○</text><text x="928" y="748" font-size="20" fill="#E5E5E5">implementation pending</text>
  </g>
</svg>
