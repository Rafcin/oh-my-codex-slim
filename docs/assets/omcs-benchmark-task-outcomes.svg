<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Verified outcomes by benchmark task</title>
  <desc id="desc">Six grouped bar panels compare Plain Codex and OMCS pass rates over three repetitions per task. Five tasks are tied. OMCS regresses on configuration diagnosis and both arms pass only one of three documentation runs.</desc>
  <rect width="1600" height="980" fill="#FFFFFF"/>
  <text x="56" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="700" fill="#111111">Verified Outcomes by Task</text>
  <text x="56" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#525252">Hidden-grader pass rate · 3 repetitions per task · exact counts above each bar</text>
  <rect x="56" y="145" width="22" height="22" rx="4" fill="#A3A3A3"/><text x="90" y="163" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#525252">Plain Codex</text>
  <rect x="238" y="145" width="22" height="22" rx="4" fill="#1E8CF4"/><text x="272" y="163" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#111111">OMCS auto</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g><text x="75" y="238" font-size="21" font-weight="700" fill="#111111">Query parser</text><line x1="78" y1="458" x2="470" y2="458" stroke="#A3A3A3"/><rect x="138" y="290" width="90" height="168" rx="4" fill="#A3A3A3"/><rect x="270" y="290" width="90" height="168" rx="4" fill="#1E8CF4"/><text x="183" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><text x="315" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><rect x="125" y="485" width="248" height="40" rx="20" fill="#F5F5F5" stroke="#A3A3A3"/><text x="249" y="511" text-anchor="middle" font-size="16" fill="#525252">tied pass · OMCS 2.68× slower</text></g>
    <g><text x="605" y="238" font-size="21" font-weight="700" fill="#111111">Inventory reservation</text><line x1="608" y1="458" x2="1000" y2="458" stroke="#A3A3A3"/><rect x="668" y="290" width="90" height="168" rx="4" fill="#A3A3A3"/><rect x="800" y="290" width="90" height="168" rx="4" fill="#1E8CF4"/><text x="713" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><text x="845" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><rect x="655" y="485" width="248" height="40" rx="20" fill="#F5F5F5" stroke="#A3A3A3"/><text x="779" y="511" text-anchor="middle" font-size="16" fill="#525252">tied pass · OMCS 2.36× slower</text></g>
    <g><text x="1135" y="238" font-size="21" font-weight="700" fill="#111111">Artifact path security</text><line x1="1138" y1="458" x2="1530" y2="458" stroke="#A3A3A3"/><rect x="1198" y="290" width="90" height="168" rx="4" fill="#A3A3A3"/><rect x="1330" y="290" width="90" height="168" rx="4" fill="#1E8CF4"/><text x="1243" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><text x="1375" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><rect x="1185" y="485" width="248" height="40" rx="20" fill="#F5F5F5" stroke="#A3A3A3"/><text x="1309" y="511" text-anchor="middle" font-size="16" fill="#525252">tied pass · OMCS 2.11× slower</text></g>
    <g><text x="75" y="624" font-size="21" font-weight="700" fill="#111111">Configuration diagnosis</text><line x1="78" y1="844" x2="470" y2="844" stroke="#A3A3A3"/><rect x="138" y="676" width="90" height="168" rx="4" fill="#A3A3A3"/><rect x="270" y="732" width="90" height="112" rx="4" fill="#1E8CF4"/><text x="183" y="660" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><text x="315" y="716" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">2 / 3</text><rect x="125" y="871" width="248" height="40" rx="20" fill="#F5F5F5" stroke="#A3A3A3"/><text x="249" y="897" text-anchor="middle" font-size="16" font-weight="600" fill="#525252">OMCS regression · 1 timeout</text></g>
    <g><text x="605" y="624" font-size="21" font-weight="700" fill="#111111">Execution documentation</text><line x1="608" y1="844" x2="1000" y2="844" stroke="#A3A3A3"/><rect x="668" y="788" width="90" height="56" rx="4" fill="#A3A3A3"/><rect x="800" y="788" width="90" height="56" rx="4" fill="#1E8CF4"/><text x="713" y="772" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">1 / 3</text><text x="845" y="772" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">1 / 3</text><rect x="655" y="871" width="248" height="40" rx="20" fill="#F5F5F5" stroke="#A3A3A3"/><text x="779" y="897" text-anchor="middle" font-size="16" fill="#525252">1 improved · 1 regressed</text></g>
    <g><text x="1135" y="624" font-size="21" font-weight="700" fill="#111111">Retry client</text><line x1="1138" y1="844" x2="1530" y2="844" stroke="#A3A3A3"/><rect x="1198" y="676" width="90" height="168" rx="4" fill="#A3A3A3"/><rect x="1330" y="676" width="90" height="168" rx="4" fill="#1E8CF4"/><text x="1243" y="660" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><text x="1375" y="660" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">3 / 3</text><rect x="1185" y="871" width="248" height="40" rx="20" fill="#F5F5F5" stroke="#A3A3A3"/><text x="1309" y="897" text-anchor="middle" font-size="16" fill="#525252">tied pass · OMCS 2.00× slower</text></g>
  </g>
  <text x="56" y="952" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#525252">No task shows an aggregate OMCS pass-rate gain in this matrix. Documentation remains unstable for both arms.</text>
</svg>
