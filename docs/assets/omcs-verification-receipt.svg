<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Example OMCS verification receipt in a macOS terminal</title>
  <desc id="desc">A synthetic Ghostty-style terminal shows a compact local verification receipt with policy and command outcomes but no private source paths, credentials, prompts, or model responses.</desc>
  <rect width="1440" height="900" fill="#F7F7F5"/>
  <rect x="56" y="48" width="1328" height="804" rx="24" fill="#171717" stroke="#303030" stroke-width="2"/>
  <path d="M80 48h1280a24 24 0 0 1 24 24v58H56V72a24 24 0 0 1 24-24Z" fill="#202020"/>
  <line x1="56" y1="130" x2="1384" y2="130" stroke="#303030" stroke-width="2"/>
  <circle cx="98" cy="89" r="12" fill="#FF605C"/><circle cx="130" cy="89" r="12" fill="#FFBD44"/><circle cx="162" cy="89" r="12" fill="#00CA4E"/>
  <text x="720" y="96" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, sans-serif" font-size="17" font-weight="500" fill="#A3A3A3">acme-widget — Codex CLI</text>
  <g font-family="&quot;SF Mono&quot;, &quot;SFMono-Regular&quot;, Menlo, Monaco, Consolas, monospace" font-size="23" dominant-baseline="middle">
    <text x="108" y="188" fill="#7DD3C7">example@acme-widget</text><text x="390" y="188" fill="#A3A3A3">~/work/acme-widget</text><text x="690" y="188" fill="#E5E5E5">$</text>
    <text x="108" y="244" fill="#F5F5F5">cat ./.omcs/runs/&lt;receipt&gt;.json</text>
    <g font-size="22">
      <text x="108" y="292" fill="#B7A7FF">{</text>
      <text x="148" y="330" fill="#A3A3A3">&quot;schemaVersion&quot;</text><text x="414" y="330" fill="#525252">:</text><text x="460" y="330" fill="#E5E5E5">1,</text>
      <text x="148" y="374" fill="#A3A3A3">&quot;profile&quot;</text><text x="414" y="374" fill="#525252">:</text><text x="460" y="374" fill="#E5E5E5">&quot;auto&quot;,</text>
      <text x="148" y="418" fill="#A3A3A3">&quot;route&quot;</text><text x="414" y="418" fill="#525252">:</text><text x="460" y="418" fill="#E5E5E5">&quot;full&quot;,</text>
      <text x="148" y="462" fill="#A3A3A3">&quot;skills&quot;</text><text x="414" y="462" fill="#525252">:</text><text x="460" y="462" fill="#E5E5E5">[&quot;tdd&quot;, &quot;verification&quot;],</text>
      <text x="148" y="506" fill="#A3A3A3">&quot;agents&quot;</text><text x="414" y="506" fill="#525252">:</text><text x="460" y="506" fill="#E5E5E5">[&quot;omcs_architect&quot;, &quot;omcs_reviewer&quot;],</text>
      <text x="148" y="550" fill="#A3A3A3">&quot;approval&quot;</text><text x="414" y="550" fill="#525252">:</text><text x="460" y="550" fill="#E5E5E5">&quot;material-decisions&quot;,</text>
      <text x="148" y="594" fill="#A3A3A3">&quot;verification&quot;</text><text x="414" y="594" fill="#525252">:</text><text x="460" y="594" fill="#E5E5E5">[{&quot;command&quot;: &quot;npm test&quot;, &quot;outcome&quot;: &quot;passed&quot;}],</text>
      <text x="148" y="638" fill="#A3A3A3">&quot;review&quot;</text><text x="414" y="638" fill="#525252">:</text><text x="460" y="638" fill="#E5E5E5">{&quot;verdict&quot;: &quot;ship&quot;}</text>
      <text x="108" y="682" fill="#B7A7FF">}</text>
    </g>
    <line x1="108" y1="724" x2="1332" y2="724" stroke="#303030" stroke-width="2"/>
    <text x="108" y="782" font-size="20" fill="#A7F3D0">✓</text><text x="144" y="782" font-size="20" fill="#E5E5E5">verification: npm test passed · review: ship</text>
  </g>
</svg>
