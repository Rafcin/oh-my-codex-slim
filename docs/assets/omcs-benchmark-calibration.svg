<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">OMCS benchmark grader calibration</title>
  <desc id="desc">All six untouched benchmark fixtures fail and all six checked-in reference oracle solutions pass. This validates grader discrimination, not OMCS performance.</desc>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="64" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#111111">Public pilot · grader calibration</text><text x="64" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#525252">Six tasks · offline · deterministic · no model usage</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif"><text x="64" y="194" font-size="18" font-weight="700" fill="#111111">Untouched fixtures</text><rect x="310" y="168" width="720" height="42" rx="6" fill="#F5F5F5" stroke="#E5E5E5"/><text x="1060" y="196" font-size="20" font-weight="700" fill="#111111">0 / 6 pass</text><text x="64" y="294" font-size="18" font-weight="700" fill="#111111">Reference oracles</text><rect x="310" y="268" width="720" height="42" rx="6" fill="#111111"/><text x="1060" y="296" font-size="20" font-weight="700" fill="#111111">6 / 6 pass</text><g fill="#525252" font-size="13"><text x="310" y="350">0</text><text x="660" y="350">3 tasks</text><text x="1010" y="350">6 tasks</text></g><line x1="64" y1="408" x2="1136" y2="408" stroke="#E5E5E5" stroke-width="2"/><text x="64" y="456" font-size="16" font-weight="700" fill="#111111">What this proves</text><text x="252" y="456" font-size="16" fill="#525252">the graders distinguish broken starts from known-good solutions</text><text x="64" y="492" font-size="16" font-weight="700" fill="#111111">What it does not prove</text><text x="282" y="492" font-size="16" fill="#525252">that OMCS outperforms plain Codex</text></g>
</svg>
