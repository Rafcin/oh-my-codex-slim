<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
  <title id="title">OMCS profile and delivery route selection</title>
  <desc id="desc">A monochrome decision map connecting a selected profile and observed risk to one of four delivery routes.</desc>
  <rect width="1440" height="680" fill="#FFFFFF"/>
  <text x="72" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#111111">Choose effort by risk, not ceremony</text>
  <text x="72" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#525252">Profiles express preference. The observed task determines the route.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="176" font-size="14" font-weight="700" fill="#525252">1 · PROFILE</text>
    <rect x="72" y="198" width="282" height="92" rx="10" fill="#F5F5F5" stroke="#111111" stroke-width="2"/><text x="96" y="236" font-size="20" font-weight="700" fill="#111111">auto · fast · thorough</text><text x="96" y="265" font-size="15" fill="#525252">council is an explicit overlay</text>
    <text x="454" y="176" font-size="14" font-weight="700" fill="#525252">2 · ASSESS</text>
    <rect x="454" y="198" width="282" height="92" rx="10" fill="#111111" stroke="#111111" stroke-width="2"/><text x="478" y="236" font-size="20" font-weight="700" fill="#FFFFFF">risk · scope · evidence</text><text x="478" y="265" font-size="15" fill="#E5E5E5">escalation is always visible</text>
    <text x="836" y="176" font-size="14" font-weight="700" fill="#525252">3 · ROUTE</text>
    <g font-size="17" font-weight="700" fill="#111111">
      <rect x="836" y="198" width="230" height="72" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="860" y="242">solo</text><text x="942" y="242" font-size="14" font-weight="400" fill="#525252">architect delivers</text>
      <rect x="1102" y="198" width="266" height="72" rx="10" fill="#F5F5F5" stroke="#111111" stroke-width="2"/><text x="1126" y="242">delegate</text><text x="1220" y="242" font-size="14" font-weight="400" fill="#525252">implementer lane</text>
      <rect x="836" y="298" width="230" height="72" rx="10" fill="#F5F5F5" stroke="#111111" stroke-width="2"/><text x="860" y="342">audit</text><text x="932" y="342" font-size="14" font-weight="400" fill="#525252">fresh reviewer</text>
      <rect x="1102" y="298" width="266" height="72" rx="10" fill="#111111" stroke="#111111" stroke-width="2"/><text x="1126" y="342" fill="#FFFFFF">full</text><text x="1178" y="342" font-size="14" font-weight="400" fill="#E5E5E5">implementer + reviewer</text>
    </g>
  </g>
  <g stroke="#525252" stroke-width="2" fill="none"><path d="M354 244 H434"/><path d="M736 244 H816"/></g><g fill="#111111"><path d="M434 244 l-12 -7 v14 z"/><path d="M816 244 l-12 -7 v14 z"/></g>
  <line x1="72" y1="438" x2="1368" y2="438" stroke="#E5E5E5" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif"><text x="72" y="492" font-size="16" font-weight="700" fill="#111111">Acceptance never moves</text><text x="72" y="524" font-size="16" fill="#525252">Every route ends with architect-owned verification. Review becomes independent when risk requires it.</text><rect x="72" y="568" width="1296" height="52" rx="8" fill="#F5F5F5"/><text x="96" y="601" font-size="15" fill="#111111">Council advises before delivery; it does not replace implementation, verification, or review.</text></g>
</svg>
