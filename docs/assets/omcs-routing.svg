<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">OMCS thin-kernel route selection</title>
  <desc id="desc">A monochrome decision map showing solo as the default, one optional auxiliary, and fresh review only when consequence and uncertainty justify it.</desc>
  <rect width="1440" height="720" fill="#FFFFFF"/>
  <text x="72" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#111111">Direct by default. Escalate on evidence.</text>
  <text x="72" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#525252">Consequence, uncertainty, blast radius, and delegation value are independent signals.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="174" font-size="14" font-weight="700" fill="#525252">1 · CLASSIFY</text>
    <rect x="72" y="196" width="354" height="104" rx="10" fill="#F5F5F5" stroke="#111111" stroke-width="2"/>
    <text x="96" y="236" font-size="20" font-weight="700" fill="#111111">consequence · uncertainty</text>
    <text x="96" y="270" font-size="15" fill="#525252">blast radius · delegation value</text>

    <text x="518" y="174" font-size="14" font-weight="700" fill="#525252">2 · DEFAULT</text>
    <rect x="518" y="196" width="250" height="104" rx="10" fill="#111111" stroke="#111111" stroke-width="2"/>
    <text x="542" y="238" font-size="24" font-weight="700" fill="#FFFFFF">solo</text>
    <text x="542" y="270" font-size="15" fill="#E5E5E5">architect delivers directly</text>

    <text x="860" y="174" font-size="14" font-weight="700" fill="#525252">3 · ESCALATE ONLY WHEN EARNED</text>
    <rect x="860" y="196" width="224" height="104" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="884" y="238" font-size="20" font-weight="700" fill="#111111">delegate</text>
    <text x="884" y="270" font-size="15" fill="#525252">one auxiliary</text>
    <rect x="1116" y="196" width="252" height="104" rx="10" fill="#F5F5F5" stroke="#111111" stroke-width="2"/>
    <text x="1140" y="238" font-size="20" font-weight="700" fill="#111111">audit</text>
    <text x="1140" y="270" font-size="15" fill="#525252">one fresh reviewer</text>
  </g>
  <g stroke="#525252" stroke-width="2" fill="none">
    <path d="M426 248 H498"/><path d="M768 248 H840"/>
  </g>
  <g fill="#111111"><path d="M498 248 l-12 -7 v14 z"/><path d="M840 248 l-12 -7 v14 z"/></g>

  <line x1="72" y1="374" x2="1368" y2="374" stroke="#E5E5E5" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="424" font-size="16" font-weight="700" fill="#111111">Review gate</text>
    <text x="72" y="458" font-size="16" fill="#525252">auto: material consequence + material uncertainty or wide blast radius</text>
    <text x="72" y="492" font-size="16" fill="#525252">thorough: fresh review always; full only when implementation delegation also has concrete value</text>
    <rect x="72" y="540" width="1296" height="92" rx="10" fill="#F5F5F5" stroke="#A3A3A3" stroke-width="2"/>
    <text x="96" y="577" font-size="17" font-weight="700" fill="#111111">Binding budget</text>
    <text x="96" y="608" font-size="15" fill="#525252">one final verification path · repeat only after inputs change · stop after green</text>
  </g>
</svg>
