<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title>OMCS adaptive delivery pipeline</title>
  <desc>An eleven-stage conditional engineering workflow from intent to evidence-backed acceptance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38BDF8"/></marker>
  </defs>
  <rect width="1440" height="620" rx="30" fill="url(#bg)"/>
  <text x="72" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700" fill="#F8FAFC">OMCS adaptive delivery pipeline</text>
  <text x="72" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#BFDBFE">A conditional system: small, settled work stays small; risk earns each gate.</text>
  <path d="M148 245 H1286" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" opacity=".95"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(76 180)"><rect width="150" height="126" rx="18" fill="#0F766E"/><text x="75" y="50" font-size="18" font-weight="700" fill="white">Intent</text><text x="75" y="79" font-size="13" fill="#CCFBF1">requested outcome</text></g>
    <g transform="translate(254 180)"><rect width="150" height="126" rx="18" fill="#155E75"/><text x="75" y="45" font-size="17" font-weight="700" fill="white">Config</text><text x="75" y="68" font-size="17" font-weight="700" fill="white">and route</text><text x="75" y="94" font-size="12" fill="#CFFAFE">visible contract</text></g>
    <g transform="translate(432 180)"><rect width="150" height="126" rx="18" fill="#1D4ED8"/><text x="75" y="45" font-size="17" font-weight="700" fill="white">Context</text><text x="75" y="68" font-size="17" font-weight="700" fill="white">and grill</text><text x="75" y="94" font-size="12" fill="#DBEAFE">ambiguity gate</text></g>
    <g transform="translate(610 180)"><rect width="150" height="126" rx="18" fill="#4338CA"/><text x="75" y="45" font-size="17" font-weight="700" fill="white">Explore</text><text x="75" y="68" font-size="17" font-weight="700" fill="white">and research</text><text x="75" y="94" font-size="12" fill="#E0E7FF">current evidence</text></g>
    <g transform="translate(788 180)"><rect width="150" height="126" rx="18" fill="#6D28D9"/><text x="75" y="45" font-size="17" font-weight="700" fill="white">Design</text><text x="75" y="68" font-size="17" font-weight="700" fill="white">decision</text><text x="75" y="94" font-size="12" fill="#EDE9FE">approval if material</text></g>
    <g transform="translate(966 180)"><rect width="150" height="126" rx="18" fill="#9D174D"/><text x="75" y="50" font-size="17" font-weight="700" fill="white">Plan</text><text x="75" y="79" font-size="12" fill="#FCE7F3">seams and ownership</text></g>
    <g transform="translate(1144 180)"><rect width="150" height="126" rx="18" fill="#BE123C"/><text x="75" y="45" font-size="17" font-weight="700" fill="white">TDD</text><text x="75" y="68" font-size="17" font-weight="700" fill="white">implementation</text><text x="75" y="94" font-size="12" fill="#FFE4E6">vertical slices</text></g>
  </g>
  <path d="M1290 333 C1300 410 1180 430 1100 430 H210 C130 430 110 450 140 494" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(180 446)"><rect width="220" height="104" rx="18" fill="#7C2D12"/><text x="110" y="43" font-size="18" font-weight="700" fill="white">Anti-slop and simplify</text><text x="110" y="71" font-size="13" fill="#FFEDD5">changed-file inspection</text></g>
    <g transform="translate(470 446)"><rect width="220" height="104" rx="18" fill="#0369A1"/><text x="110" y="43" font-size="18" font-weight="700" fill="white">Fresh verification</text><text x="110" y="71" font-size="13" fill="#E0F2FE">actual acceptance evidence</text></g>
    <g transform="translate(760 446)"><rect width="220" height="104" rx="18" fill="#4F46E5"/><text x="110" y="43" font-size="18" font-weight="700" fill="white">Risk-gated review</text><text x="110" y="71" font-size="13" fill="#E0E7FF">fresh, read-only audit</text></g>
    <g transform="translate(1050 446)"><rect width="220" height="104" rx="18" fill="url(#accent)"/><text x="110" y="43" font-size="18" font-weight="700" fill="#0F172A">Acceptance</text><text x="110" y="71" font-size="13" fill="#0F172A">architect-owned outcome</text></g>
  </g>
</svg>
